name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/beautiful-newton-zdjufz]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Bug check before every deploy: real browsers (a TV and a phone) against
  # the Firebase emulators. If anything fails, nothing gets deployed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test
      - run: npx -y firebase-tools@13 emulators:exec --only firestore,auth --project demo-mono "npm test"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is still "Deploy from a branch",
      # GitHub also publishes the raw (unbuilt) source on every push, which
      # renders a blank page. Let that finish first so this deploy wins.
      - name: Wait for branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || echo unknown)
          [ "$type" = "legacy" ] || exit 0
          echo "::warning::Pages source is 'Deploy from a branch'. Set Settings → Pages → Source to 'GitHub Actions' to skip this wait."
          for i in $(seq 60); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed")] | length')
            [ "$pending" = 0 ] && exit 0
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
